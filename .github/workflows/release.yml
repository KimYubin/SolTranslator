name: release

on:
  push:
    tags:
      - "v*"

  schedule: 
    - cron: "5 18 * * *" # Avoid peak time.

jobs:
  check-run-build:
    runs-on: ubuntu-latest
    outputs:
      run-build: ${{ steps.set-run-build.outputs.run-build }}
    steps:
      - uses: actions/checkout@v6
      - name: Check run-build
        id: set-run-build
        run: |
          IS_RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HEAD=$(git rev-parse HEAD)
            NIGHTLY=$(git ls-remote --tags origin nightly^{} | awk '{print $1}')

            if [ -n "$NIGHTLY" ] && [ "$HEAD" = "$NIGHTLY" ]; then
              IS_RUN=false
            fi
          fi

          echo "run-build=$IS_RUN" >> "$GITHUB_OUTPUT"

  build:
    runs-on: windows-latest
    needs: check-run-build
    if: needs.check-run-build.outputs.run-build == 'true'

    env:
      TAG_NAME: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Delete nightly release and tag
        if: github.event_name == 'schedule'
        run: |
          gh release delete nightly --cleanup-tag --yes || echo "No existing nightly"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          dir: '${{ github.workspace }}'
          cache: 'true'

      - name: Configure
        run: |
          cmake -S . -B build -G "MinGW Makefiles" `
          -DCMAKE_C_COMPILER='${{ github.workspace }}\Qt\Tools\mingw1310_64\bin\gcc.exe' `
          -DCMAKE_CXX_COMPILER='${{ github.workspace }}\Qt\Tools\mingw1310_64\bin\g++.exe' `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\deploy

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Install (deploy)
        run: |
          cmake --install build --config Release

      - name: Compress install folder
        run: |
          Compress-Archive -Path ${{ github.workspace }}\deploy\* -DestinationPath SolTranslator.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ github.event_name == 'schedule' && 'nightly' || format('SolTranslator {0}', env.TAG_NAME) }}
          prerelease: ${{ github.event_name == 'schedule' }}
          files: SolTranslator.zip
